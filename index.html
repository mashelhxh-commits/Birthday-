const SC={cake:{bg:0x2a1233,sun:[0xffe2d0,1.1],a:.55,cam:[0,3.6,7.4],look:[0,1.2,0],sp:[4,7,5],cap:'Make a wish…'},hug:{bg:0x3a1d2b,sun:[0xffc48a,1.2],a:.5,cam:[0,2,6.2],look:[0,1.2,0],sp:[3,6,5],cap:'A hug, just for you'},night:{bg:0x060a1f,sun:[0x9fb6ff,.9],a:.25,cam:[0,2,6.5],look:[0,1.4,0],sp:[-4,7,4],cap:'Under the stars'},gifts:{bg:0x2a1540,sun:[0xffe2d0,1],a:.5,cam:[0,3.4,7.4],look:[0,.6,0],sp:[3,7,5],cap:'Open your gifts'}};
let cur='cake',intro=true,T=0,t0=0,ct0=0,cs=new THREE.Color(0x2a1233),tgt=new THREE.Vector3(0,3.6,11),lk=new THREE.Vector3(0,1.2,0),lkT=new THREE.Vector3(0,1.2,0),sunC=new THREE.Color(),sunI=1,ambI=.5,sunP=new THREE.Vector3(4,7,5);
const tw=[];const tween=(d,f,cb)=>tw.push({s:T,d,f,cb});
const $$=s=>[...document.querySelectorAll(s)],toast=m=>{const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,2600)};
function go(n){const ov=['mem','letter'];ov.forEach(o=>$('#'+o).classList.add('hide'));$$('#nav .pill').forEach(b=>b.classList.toggle('on',b.dataset.s==n));
 if(ov.includes(n)){$('#'+n).classList.remove('hide');if(n=='letter')openLetter();return}
 cur=n;Object.keys(G).forEach(k=>G[k].visible=k==n);G[n].rotation.y=0;const s=SC[n];cs.set(s.bg);sunC.set(s.sun[0]);sunI=s.sun[1];ambI=s.a;sunP.set(...s.sp);tgt.set(...s.cam);lkT.set(...s.look);t0=T;$('#cap').textContent=s.cap;$('#cut').style.display=n=='cake'?'':'none';if(n=='hug'||n=='night')$('#cap').style.opacity=1}
['Cake','Hug','Night','Gifts','Memories','Letter'].forEach(n=>{const b=document.createElement('button');b.className='pill';b.textContent=n;b.dataset.s=({Memories:'mem',Letter:'letter'})[n]||n.toLowerCase();b.onclick=()=>go(b.dataset.s);$('#nav').appendChild(b)});
function fit(){const w=innerWidth,h=innerHeight;R.setSize(w,h);cam.aspect=w/h;cam.fov=w/h<1?62:45;cam.updateProjectionMatrix()}addEventListener('resize',fit);fit();

/* ---- interactions ---- */
let dn=null,mv=0;const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),cvs=$('#c');
cvs.addEventListener('pointerdown',e=>{dn={x:e.clientX,y:e.clientY};mv=0});
addEventListener('pointermove',e=>{if(!dn)return;const dx=e.clientX-dn.x;mv+=Math.abs(dx)+Math.abs(e.clientY-dn.y);dn={x:e.clientX,y:e.clientY};const g=G[cur];g.rotation.y+=dx*.012;if(cur!='cake')g.rotation.y=Math.max(-.7,Math.min(.7,g.rotation.y))});
addEventListener('pointerup',e=>{if(dn&&mv<8&&!intro)pick(e);dn=null});
function pick(e){mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mouse,cam);for(const x of ray.intersectObjects(G[cur].children,true)){let o=x.object;while(o&&o.userData.pick===undefined)o=o.parent;if(o){act(o.userData.pick);return}}}
function act(p){if(typeof p=='number')return openGift(p);if(p=='moon')toast('The moon is jealous of how bright you shine ✨');if(p=='girl'){toast('Psst… you are loved more than you know ♡');burst(0,2,0)}if(p=='cake')toast('Close your eyes and make a wish…')}
function openGift(i){const o=gifts[i],d=CFG.gifts[i]||{t:'Surprise',m:''};if(!o.open){o.open=true;tween(1.2,p=>{o.lid.position.y=o.h+p*1.3;o.lid.position.x=p*.6;o.lid.rotation.z=p*.9;o.orb.scale.setScalar(p);o.orb.position.y=o.h+.2+p*.9});burst(o.g.position.x,o.h+.5,o.g.position.z)}
 setTimeout(()=>{$('#pt').textContent=d.t;$('#pm').textContent=d.m;const im=$('#pi');im.style.display=d.img?'block':'none';if(d.img)im.src=d.img;$('#pop').classList.remove('hide')},o.open?900:1100)}
$('#px').onclick=()=>$('#pop').classList.add('hide');
let cutS=0;const cb=$('#cut');cb.textContent='Blow candles & cut the cake';
cb.onclick=()=>{if(cutS==1)return;if(cutS==2){flames.forEach(f=>f.visible=true);cl.intensity=.9;tween(.8,p=>slice.scale.setScalar(.55*(1-p)+.001));cutS=0;cb.textContent='Blow candles & cut the cake';return}
 cutS=1;flames.forEach(f=>f.visible=false);cl.intensity=0;toast('Make a wish! ✨');burst(0,2.6,0);knife.visible=true;
 tween(1.6,p=>{knife.position.y=3.6-Math.sin(p*Math.PI)*2.1;knife.position.z=1.4-p*.4+Math.sin(p*18)*.04},()=>{knife.visible=false;tween(1.2,p=>slice.scale.setScalar(.55*p+.001),()=>{cutS=2;cb.textContent='Light the candles again';burst(3.4,1.5,1.4)})})};

/* ---- gate / flow ---- */
const st=n=>$$('#gate .st').forEach((e,i)=>e.style.display=i==n?'block':'none');st(0);
$('#ok').onclick=()=>{if($('#pw').value.trim()===CFG.pass)st(1);else{$('#err').textContent='Hmm, that’s not it. Try again…';$('#pw').value=''}};
$('#pw').addEventListener('keydown',e=>{if(e.key=='Enter')$('#ok').click()});
$('#r1').onclick=()=>st(2);
const dd=$('#dodge'),mvD=()=>{dd.style.transform=`translate(${(Math.random()-.5)*160}px,${(Math.random()-.5)*60}px)`};dd.onpointerenter=mvD;dd.onclick=()=>{mvD();toast('Nice try 😉')};
$('#name').innerHTML=[...CFG.name].map((c,i)=>`<span class="l" style="animation-delay:${.6+i*.18}s">${c}</span>`).join('');
const unlock=()=>{$('#gate').classList.add('hide');$('#intro').classList.remove('hide');$('#music').classList.remove('hide');music(true);ct0=T;go('cake');$('#cap').style.opacity=0;burst(0,2,0)};
$('#e1').onclick=$('#e2').onclick=unlock;
$('#begin').onclick=()=>{intro=false;$('#intro').classList.add('hide');$('#hud').classList.remove('hide');$('#cap').style.opacity=1;go('cake')};
setTimeout(()=>{if(!$('#gate').classList.contains('hide')){}},0);

/* memories + letter */
let mems=CFG.memories.map(m=>({...m}));const cols2=['#ff9ec0,#ffd9a0','#9b7bff,#ffb3c6','#4fd1c5,#ffe08a','#ffb347,#ff7eb0'];
function renderMem(){$('#grid').innerHTML='';mems.forEach((m,i)=>{const d=document.createElement('div');d.className='pl';d.style.cssText=`--r:${(i*7%11-5)}deg;--d:${i*.12}s`;d.innerHTML=`<div class="im" style="background-image:${m.src?`url(${m.src})`:`linear-gradient(135deg,${cols2[i%4]})`}"></div>${m.cap}`;d.onclick=()=>{$('#pt').textContent=m.cap;$('#pm').textContent='';const im=$('#pi');im.style.display=m.src?'block':'none';if(m.src)im.src=m.src;$('#pop').classList.remove('hide')};$('#grid').appendChild(d)})}renderMem();
$('#file').onchange=e=>{[...e.target.files].forEach(f=>mems.push({cap:'A memory with you',src:URL.createObjectURL(f)}));renderMem()};
function openLetter(){const b=$('#lbox');b.innerHTML='<div class="env" id="env"><div class="flap"></div></div><p style="margin-top:14px">Tap the envelope to open</p>';$('#env').onclick=()=>{$('#env').classList.add('open');setTimeout(()=>{b.innerHTML='';const p=document.createElement('div');p.className='paper';p.textContent=CFG.letter;b.appendChild(p)},950)}}

/* music (soft generated pad, or CFG.musicUrl) */
let ac,mg,mt,au,ci=0;const CH=[[261.6,329.6,392],[196,246.9,293.7],[220,261.6,329.6],[174.6,220,261.6]];
function chord(){const t=ac.currentTime,c=CH[ci++%4];c.forEach((f,k)=>{[f,f*2].forEach((ff,j)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=j?'sine':'triangle';o.frequency.value=ff;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(j?.05:.09,t+1.2);g.gain.linearRampToValueAtTime(0,t+4.2);o.connect(g);g.connect(mg);o.start(t);o.stop(t+4.3)});const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f*4;g.gain.setValueAtTime(0,t+k*.5+.6);g.gain.linearRampToValueAtTime(.05,t+k*.5+.65);g.gain.exponentialRampToValueAtTime(.001,t+k*.5+1.6);o.connect(g);g.connect(mg);o.start(t+k*.5+.6);o.stop(t+k*.5+1.7)})}
function music(on){$('#mp').textContent=on?'Pause':'Play music';const v=+$('#vol').value;
 if(CFG.musicUrl){au=au||Object.assign(new Audio(CFG.musicUrl),{loop:true});au.volume=v;on?au.play().catch(()=>{}):au.pause();return}
 try{if(on){ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();if(!mg){mg=ac.createGain();mg.gain.value=0;mg.connect(ac.destination)}mg.gain.cancelScheduledValues(ac.currentTime);mg.gain.setTargetAtTime(v,ac.currentTime,.8);clearInterval(mt);chord();mt=setInterval(chord,3600)}else if(ac){mg.gain.setTargetAtTime(0,ac.currentTime,.4);clearInterval(mt)}}catch(e){}}
let pl=false;$('#mp').onclick=()=>{pl=!pl;music(pl)};const _m=music;music=function(o){pl=o;_m(o)};
$('#vol').oninput=e=>{const v=+e.target.value;if(au)au.volume=v;else if(mg&&pl)mg.gain.setTargetAtTime(v,ac.currentTime,.1)};

/* ---- loop ---- */
const clock=new THREE.Clock();
function tick(){requestAnimationFrame(tick);T+=Math.min(clock.getDelta(),.05);
 for(let i=tw.length-1;i>=0;i--){const w=tw[i],p=Math.min(1,(T-w.s)/w.d);w.f(p);if(p>=1){tw.splice(i,1);w.cb&&w.cb()}}
 const s=SC[cur];if(intro)tgt.set(0,3.8,11.5);cam.position.lerp(tgt,.04);lk.lerp(lkT,.05);cam.lookAt(lk);
 sc.background.lerp(cs,.04);sun.color.lerp(sunC,.05);sun.intensity+=(sunI-sun.intensity)*.05;amb.intensity+=(ambI-amb.intensity)*.05;sun.position.lerp(sunP,.05);
 if(intro)G[cur].rotation.y+=.004;
 const e=Math.min(1,(T-ct0)/3.5),ee=1-Math.pow(1-e,3);cakeG.position.y=(1-ee)*-4+Math.sin(T*1.5)*.04*ee;cakeG.scale.setScalar(.2+.8*ee);
 flames.forEach((f,i)=>{f.scale.set(1+Math.sin(T*18+i)*.1,1.9+Math.sin(T*23+i*2)*.3,1)});if(cutS!=1&&cutS!=2)cl.intensity=.75+Math.sin(T*20)*.15;
 const k=Math.min(1,(T-t0)/9),sm=k*k*(3-2*k);
 if(cur=='hug'){const d=1.55-1.2*sm;hb.position.x=-d;hg.position.x=d;[hb,hg].forEach((p,i)=>{const u=p.userData;u.aL.rotation.set(-1.45*sm,-.9*sm*(i?-1:1)*-1,0);u.aR.rotation.set(-1.45*sm,.9*sm*(i?-1:1)*-1,0);u.head.rotation.x=.12*sm+Math.sin(T)*.02;u.head.rotation.y=Math.sin(T*.5)*.1;u.torso.scale.y=1+Math.sin(T*1.6)*.012});hg.position.y=0;hl.intensity=1+Math.sin(T)*.2}
 if(cur=='night'){[nb2,ng2].forEach((p,i)=>{const u=p.userData;u.head.rotation.y=Math.sin(T*.4+i)*.18+(i?.12:-.12);u.head.rotation.x=Math.sin(T*.7+i)*.04;u.torso.scale.y=1+Math.sin(T*1.5+i)*.015});G.night.rotation.y=Math.max(-.7,Math.min(.7,G.night.rotation.y));stars.material.opacity=.75+Math.sin(T*2)*.15}
 hearts.forEach(h=>{h.position.y+=h.userData.v*.01;h.rotation.y+=.01;if(h.position.y>7){h.position.y=-3;h.position.x=(Math.random()-.5)*14}});
 const a=pg.attributes.position;for(let i=0;i<NP;i++){let y=a.getY(i)+.004+(i%5)*.0008;if(y>8)y=0;a.setY(i,y)}a.needsUpdate=true;
 if(confT>0){confT-=.016;const c=cg.attributes.position;for(let i=0;i<NC;i++){cv2[i].y-=.12*.16;cp[i*3]+=cv2[i].x*.016;cp[i*3+1]+=cv2[i].y*.016;cp[i*3+2]+=cv2[i].z*.016}c.needsUpdate=true}else if(cp[1]>-40){for(let i=0;i<NC;i++)cp[i*3+1]=-50;cg.attributes.position.needsUpdate=true}
 R.render(sc,cam)}
tick();
</script></body></html>
